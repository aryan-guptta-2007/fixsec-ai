# Production stack: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: fixsec_ai
      POSTGRES_USER: fixsec_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixsec_user -d fixsec_ai"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://fixsec_user:${POSTGRES_PASSWORD}@postgres:5432/fixsec_ai
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      BACKEND_URL: ${BACKEND_URL:?set BACKEND_URL}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL}
      CORS_ORIGINS: ${FRONTEND_URL}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_STARTER_PRICE_ID: ${STRIPE_STARTER_PRICE_ID:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      STRIPE_TEAM_PRICE_ID: ${STRIPE_TEAM_PRICE_ID:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Next.js inlines NEXT_PUBLIC_* at build time, so this must be a build arg.
        NEXT_PUBLIC_API_URL: ${BACKEND_URL:?set BACKEND_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
